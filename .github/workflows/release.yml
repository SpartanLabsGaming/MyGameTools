name: Release

# Publishing to Maven Central is deliberately NOT here — it is run by hand with
# `./gradlew publishAndReleaseToMavenCentral` (see CONTRIBUTING.md). This workflow only
# validates the tagged commit and cuts the GitHub Release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    name: Verify tagged build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "23"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --stacktrace

  github-release:
    name: GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
