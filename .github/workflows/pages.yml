name: Pages

# Publishes the project website (website/) with the Dokka API reference mounted at /api/.
# Enable once under Settings -> Pages -> Build and deployment -> Source -> GitHub Actions.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one in flight — a cancelled deploy leaves the
# live site on the previous commit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
      - uses: gradle/actions/setup-gradle@v6

      # The root project aggregates every module into one publication (see build.gradle.kts).
      - name: Generate API docs (Dokka)
        run: ./gradlew dokkaGeneratePublicationHtml --stacktrace

      - name: Assemble _site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R website/. _site/
          rm -f _site/README.md   # notes for maintainers, not part of the published site

          # Brand assets (the Spartan Gaming logo) live once in docs/brand and are shared with
          # the Dokka theme; the page references them under assets/brand/.
          mkdir -p _site/assets/brand
          cp -R docs/brand/. _site/assets/brand/

          # Dokka's V2 plugin writes the aggregated publication to build/dokka/html; fall back
          # to a search so a future output-directory change fails loudly rather than silently
          # shipping a site with no API reference.
          docs="build/dokka/html"
          if [ ! -f "$docs/index.html" ]; then
            docs="$(dirname "$(find . -path '*/build/dokka/html/index.html' -print -quit)")"
          fi
          if [ ! -f "$docs/index.html" ]; then
            echo "::error::No Dokka output found - expected build/dokka/html/index.html"
            exit 1
          fi
          echo "Publishing API docs from $docs"
          cp -R "$docs" _site/api

          # Dokka ships files and directories whose names start with an underscore; Jekyll
          # would drop them, so opt the whole artifact out of it.
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
